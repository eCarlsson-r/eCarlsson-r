name: Deploy Portfolio with Signals

on:
  push:
    branches: ["main"]

  schedule:
    # Runs daily at 2 AM UTC
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Inject GitHub Token
        run: echo "GITHUB_TOKEN=${{ secrets.API_TOKEN }}" >> $GITHUB_ENV

      - name: Generate Signals
        run: npm run generate-signals

      - name: Build Next.js site
        run: npm run build

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4